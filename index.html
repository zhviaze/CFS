<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFS株式会社 | 専用ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes cfsFadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cfs-fade-up {
      animation: cfsFadeUp 0.9s ease-out both;
    }

    @media (prefers-reduced-motion: reduce) {
      .cfs-fade-up {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="bg-[#F2FAFF] px-4 pt-6 pb-4 font-sans text-slate-950 md:px-8 md:pt-10 md:pb-6" style="margin:0; min-height:0; height:auto; overflow:auto;">
  <section class="relative mx-auto mb-0 max-w-[1500px] overflow-hidden rounded-[36px] border border-sky-100 bg-[linear-gradient(135deg,#ffffff_0%,#f8fdff_46%,#e4f6ff_100%)] px-8 py-10 shadow-[0_30px_90px_rgba(18,155,239,0.12)] backdrop-blur-sm md:px-12 md:py-16">
    
    <div class="relative z-10 max-w-3xl cfs-fade-up">
      <div class="flex items-center gap-5">
        <svg class="h-16 w-16 shrink-0" viewBox="0 0 126 126">
          <rect x="4" y="4" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"></rect>
          <rect x="46" y="4" width="34" height="34" rx="8" fill="#129BEF" stroke="#6D6D6D" stroke-width="2"></rect>
          <rect x="88" y="4" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"></rect>
          <rect x="4" y="46" width="34" height="34" rx="8" fill="#129BEF" stroke="#6D6D6D" stroke-width="2"></rect>
          <rect x="46" y="46" width="34" height="34" rx="8" fill="#129BEF" stroke="#6D6D6D" stroke-width="2"></rect>
          <rect x="88" y="46" width="34" height="34" rx="8" fill="#129BEF" stroke="#6D6D6D" stroke-width="2"></rect>
          <rect x="4" y="88" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"></rect>
          <rect x="46" y="88" width="34" height="34" rx="8" fill="#129BEF" stroke="#6D6D6D" stroke-width="2"></rect>
          <rect x="88" y="88" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="2"></rect>
        </svg>

        <div class="leading-none">
          <div class="text-[32px] font-semibold tracking-[-0.06em] text-black md:text-[40px]">
            CFS株式会社
          </div>
          <div class="mt-2 text-lg tracking-[-0.02em] text-black/80 md:text-xl">
            Cross Finance Services
          </div>
        </div>
      </div>

      <div class="mt-16 h-1 w-16 rounded-full bg-gradient-to-r from-[#129BEF] to-[#2B4CFF]"></div>

      <p class="mt-12 max-w-2xl text-lg leading-relaxed text-slate-700 font-semibold">
        グローバルペイメント・ネットワークで、<br />国境を越えたシームレスな決済体験を実現します。
      </p>
    </div>

    <section class="relative z-10 mt-16 rounded-[28px] border border-sky-100 bg-white/82 cfs-fade-up p-8 backdrop-blur">
      <div class="mb-7">
        <div class="text-sm font-semibold tracking-[0.22em] text-[#129BEF]">会社基本情報</div>
        <h2 class="mt-3 text-2xl font-semibold tracking-[-0.04em] text-[#050A1F]">COMPANY INFORMATION</h2>
      </div>
      <div class="grid gap-4 md:grid-cols-3">
        <div class="rounded-[22px] border border-sky-100 bg-[#F8FDFF] p-6">
          <div class="mb-4 text-sm font-semibold tracking-[0.16em] text-slate-500">社名</div>
          <div class="text-lg font-semibold text-slate-950">CFS株式会社</div>
          <div class="mt-2 text-sm text-slate-600">Cross Finance Services</div>
        </div>
        <div class="rounded-[22px] border border-sky-100 bg-[#F8FDFF] p-6">
          <div class="mb-4 text-sm font-semibold tracking-[0.16em] text-slate-500">設立年</div>
          <div class="text-lg font-semibold text-slate-950">2023年</div>
          <div class="mt-2 text-sm text-slate-600">Established in 2023</div>
        </div>
        <div class="rounded-[22px] border border-sky-100 bg-[#F8FDFF] p-6">
          <div class="mb-4 text-sm font-semibold tracking-[0.16em] text-slate-500">会社住所</div>
          <div class="text-lg font-semibold text-slate-950">東京都港区白金台3-7-29</div>
          <div class="mt-2 text-sm text-slate-600">Minato-ku, Tokyo</div>
        </div>
      </div>
    </section>

  </section>

  <script>
    window.addEventListener('load', function () {
      document.documentElement.style.margin = '0';
      document.documentElement.style.padding = '0';
      document.body.style.margin = '0';
      document.body.style.paddingBottom = '16px';
      document.body.style.minHeight = '0';
      document.body.style.height = 'auto';
      document.body.style.overflow = 'auto';
    });
  </script>
</body>
</html>
